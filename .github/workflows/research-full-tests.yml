name: GNSS complete model and GoogleTest build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install official Linux OpenCPN build prerequisites
        run: |
          ./ci/github-pre-build.sh
      - name: Configure official project test target
        run: |
          cmake -S . -B /tmp/opencpn-gnss-build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOCPN_BUILD_TEST=ON \
            -DOCPN_USE_GL=OFF
      - name: Compile model and real project GoogleTest target
        run: cmake --build /tmp/opencpn-gnss-build --target tests -j 2
      - name: Run native CommDecoder GNSS regressions
        run: /tmp/opencpn-gnss-build/test/tests --gtest_filter='GNSSValidityResearch.*'
